[package]
name = "codeagent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A lightweight Slint control surface for Codex"
build = "build.rs"

[dependencies]
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
codeagent-app.workspace = true
codeagent-core.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
slint.workspace = true
rfd = { version = "0.15", default-features = false }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"

[build-dependencies]
slint-build.workspace = true

[[bin]]
name = "codeagent"
path = "src/main.rs"
