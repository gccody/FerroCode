[package]
name = "ferro-code"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A lightweight Slint control surface for Codex"
build = "build.rs"

[dependencies]
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
ferro-code-app.workspace = true
ferro-code-core.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
slint.workspace = true
tempfile = "3"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { version = "0.15", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "ferro-code"
path = "src/main.rs"
