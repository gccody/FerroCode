[workspace]
members = [
    "crates/ferro-code-core",
    "crates/ferro-code-protocol",
    "crates/ferro-code-app",
    "crates/ferro-code-desktop",
]
default-members = ["crates/ferro-code-desktop"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
ferro-code-core = { path = "crates/ferro-code-core" }
ferro-code-protocol = { path = "crates/ferro-code-protocol" }
ferro-code-app = { path = "crates/ferro-code-app" }
crossbeam-channel = "0.5"
codex-app-server-client = { git = "https://github.com/openai/codex.git", rev = "6478a751fde8884b2fdc76486fe23175a8e795d4" }
codex-app-server-protocol = { git = "https://github.com/openai/codex.git", rev = "6478a751fde8884b2fdc76486fe23175a8e795d4" }
codex-arg0 = { git = "https://github.com/openai/codex.git", rev = "6478a751fde8884b2fdc76486fe23175a8e795d4" }
codex-config = { git = "https://github.com/openai/codex.git", rev = "6478a751fde8884b2fdc76486fe23175a8e795d4" }
codex-core = { git = "https://github.com/openai/codex.git", rev = "6478a751fde8884b2fdc76486fe23175a8e795d4" }
codex-feedback = { git = "https://github.com/openai/codex.git", rev = "6478a751fde8884b2fdc76486fe23175a8e795d4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
# Skia preserves the color layers in native system emoji fonts. Slint's
# lightweight software renderer rasterizes the same glyphs as monochrome outlines.
slint = { version = "=1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-skia", "compat-1-2", "unstable-winit-030"] }
slint-build = "=1.17.1"
windows = "0.62.2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
debug = 1

# Keep useful line information for workspace crates without producing several
# gigabytes of debug symbols for third-party dependencies during development.
[profile.dev.package."*"]
debug = 0

# Codex currently relies on proxy/deflate support carried by these upstream
# forks. Keep the same pinned revisions as the Codex workspace revision above.
[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."https://github.com/openai/codex.git"]
codex-utils-pty = { path = "vendor/codex-utils-pty" }
