[workspace]
members = [
    "crates/codeagent-core",
    "crates/codeagent-protocol",
    "crates/codeagent-app",
    "crates/codeagent-desktop",
]
default-members = ["crates/codeagent-desktop"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
codeagent-core = { path = "crates/codeagent-core" }
codeagent-protocol = { path = "crates/codeagent-protocol" }
codeagent-app = { path = "crates/codeagent-app" }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Skia preserves the color layers in native system emoji fonts. Slint's
# lightweight software renderer rasterizes the same glyphs as monochrome outlines.
slint = { version = "=1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-skia", "compat-1-2", "unstable-winit-030"] }
slint-build = "=1.17.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
debug = 1

# Keep useful line information for workspace crates without producing several
# gigabytes of debug symbols for third-party dependencies during development.
[profile.dev.package."*"]
debug = 0
